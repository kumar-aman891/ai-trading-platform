name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; individual jobs opt into more only if needed.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Format / Lint / Types / Architecture / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (dev group, all packages)
        run: uv sync --all-packages --group dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check (mypy --strict)
        run: make typecheck

      - name: Architecture / import-linter contracts
        run: make arch-check

      - name: Safety suite (must never be skipped)
        run: make test-safety

      - name: Full test suite with coverage
        run: make coverage

  integration:
    name: Integration tests (real PostgreSQL/Redis via Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The main integration suite below needs no uv/Python on the runner -
      # `make test-integration` only shells out to `docker compose`, which
      # builds and runs pytest *inside* ops/docker/Dockerfile.test's own
      # image. The host-side toolchain here exists solely for the lifecycle
      # tests, which cannot run in that container.
      #
      # tests/integration/db/test_stack_lifecycle.py's two tests drive
      # `docker compose` itself rather than connecting to an already-running
      # stack, so they cannot run inside the `test-runner` container the step
      # below starts: that container has no docker CLI, no docker socket, and
      # sits on an `internal: true` network - and starting the stack from
      # inside the stack is circular anyway. Run on the host, which does have
      # docker, so they actually execute instead of contributing two
      # permanent skips to a gate that requires zero.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync workspace (dev group, all packages)
        run: uv sync --all-packages --group dev --frozen
      - name: Docker Compose lifecycle tests (host-side; need the docker CLI)
        env:
          RUN_DOCKER_LIFECYCLE_TESTS: "1"
        run: |
          set -o pipefail
          uv run pytest tests/integration/db/test_stack_lifecycle.py -v             2>&1 | tee /tmp/lifecycle.log
          # pytest exits 0 when every test skips, so a green step is not
          # evidence these two ran - `_require_docker()` skips if the CLI
          # is missing, and the module-level skipif would too if the env
          # var above were ever dropped. Assert the count explicitly.
          grep -qE '^=+ 2 passed' /tmp/lifecycle.log || {
            echo "expected exactly 2 passed from test_stack_lifecycle.py" >&2
            exit 1
          }

      # This job carried `continue-on-error: true` from Step 5 until Phase 1
      # Step 12 Phase A, because these tests had never executed anywhere.
      # They have now: the suite runs green against a real PostgreSQL/Redis
      # stack, so the flag is gone and an integration failure fails CI.
      # Do not reintroduce it.
      - name: Run integration suite against a real stack (ATP_REQUIRE_INTEGRATION_STACK=1)
        env:
          ATP_REQUIRE_INTEGRATION_STACK: "1"
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee /tmp/integration.log

      # `make test-integration` exiting 0 is not by itself evidence the
      # worker suite ran - the same reasoning the lifecycle step above
      # already applies to its own two tests, and the reason
      # ATP_REQUIRE_INTEGRATION_STACK exists at all. Assert the five
      # tests in test_worker_job_queue.py actually executed and passed,
      # so a future regression that silently skips them (a renamed
      # fixture, a dropped DSN, a collection error) fails this job
      # instead of quietly reporting green.
      #
      # The annotations are load-bearing, not decoration: GitHub's
      # job-log API requires admin rights even on a public repository,
      # while check-run annotations are readable anonymously - so this is
      # what makes an integration result reviewable from outside the repo
      # at all.
      - name: Assert the worker integration suite executed (and report counts)
        if: always()
        run: |
          if [ ! -f /tmp/integration.log ]; then
            echo "::error title=integration-diagnostic::/tmp/integration.log does not exist"
            exit 1
          fi
          emit_error() {
            body="$1"
            [ -z "$body" ] && return 0
            escaped=$(printf '%s' "$body" | sed 's/%/%25/g' | sed 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$2::${escaped}"
          }
          summary=$(grep -aE '^=+ .*(passed|failed|error)' /tmp/integration.log | tail -1)
          worker_passed=$(grep -acE 'test_worker_job_queue\.py::[a-z_]+ PASSED' /tmp/integration.log || true)
          worker_bad=$(grep -acE 'test_worker_job_queue\.py::[a-z_]+ (FAILED|ERROR|SKIPPED)' /tmp/integration.log || true)
          echo "::notice title=integration-counts::${summary} || worker_passed=${worker_passed} worker_not_passed=${worker_bad}"
          if [ "${worker_passed}" -ne 5 ] || [ "${worker_bad}" -ne 0 ]; then
            emit_error "expected 5 passed / 0 non-passed in test_worker_job_queue.py, got passed=${worker_passed} not-passed=${worker_bad}. Summary: ${summary}" "worker-suite-did-not-execute"
            emit_error "$(sed -n '/short test summary info/,$p' /tmp/integration.log | head -c 3500)" "pytest-summary"
            emit_error "$(grep -anE '^E  |Interrupted|error during collection|ModuleNotFoundError|ImportError' /tmp/integration.log | head -40 | head -c 3500)" "pytest-errors"
            emit_error "$(tail -60 /tmp/integration.log | head -c 3500)" "log-tail"
            exit 1
          fi


  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
