name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; individual jobs opt into more only if needed.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Format / Lint / Types / Architecture / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (dev group, all packages)
        run: uv sync --all-packages --group dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check (mypy --strict)
        run: make typecheck

      - name: Architecture / import-linter contracts
        run: make arch-check

      - name: Safety suite (must never be skipped)
        run: make test-safety

      - name: Full test suite with coverage
        run: make coverage

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
