name: CI

on:
  push:
    # TEMPORARY (Phase 1 Step 12 Phase A iteration): step12-phase-a-verify
    # added so this branch's pushes trigger CI directly, since PR creation
    # isn't available in this pass. Remove before merging to main.
    branches: [main, step12-phase-a-verify]
  pull_request:

# Least-privilege default; individual jobs opt into more only if needed.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Format / Lint / Types / Architecture / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace (dev group, all packages)
        run: uv sync --all-packages --group dev

      - name: Format check
        run: make format-check

      - name: Lint
        run: make lint

      - name: Type check (mypy --strict)
        run: make typecheck

      - name: Architecture / import-linter contracts
        run: make arch-check

      - name: Safety suite (must never be skipped)
        run: make test-safety

      - name: Full test suite with coverage
        run: make coverage

  integration:
    name: Integration tests (real PostgreSQL/Redis via Docker)
    runs-on: ubuntu-latest
    # TEMPORARY (step12-phase-a-verify iteration only): issues: write lets
    # the diagnostic-on-failure step below post a log excerpt somewhere
    # readable without log-download auth. Remove before merging to main.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      # The main integration suite below needs no uv/Python on the runner -
      # `make test-integration` only shells out to `docker compose`, which
      # builds and runs pytest *inside* ops/docker/Dockerfile.test's own
      # image. The host-side toolchain here exists solely for the lifecycle
      # tests, which cannot run in that container.
      #
      # tests/integration/db/test_stack_lifecycle.py's two tests drive
      # `docker compose` itself rather than connecting to an already-running
      # stack, so they cannot run inside the `test-runner` container the step
      # below starts: that container has no docker CLI, no docker socket, and
      # sits on an `internal: true` network - and starting the stack from
      # inside the stack is circular anyway. Run on the host, which does have
      # docker, so they actually execute instead of contributing two
      # permanent skips to a gate that requires zero.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync workspace (dev group, all packages)
        run: uv sync --all-packages --group dev --frozen
      - name: Docker Compose lifecycle tests (host-side; need the docker CLI)
        env:
          RUN_DOCKER_LIFECYCLE_TESTS: "1"
        run: |
          set -o pipefail
          uv run pytest tests/integration/db/test_stack_lifecycle.py -v             2>&1 | tee /tmp/lifecycle.log
          # pytest exits 0 when every test skips, so a green step is not
          # evidence these two ran - `_require_docker()` skips if the CLI
          # is missing, and the module-level skipif would too if the env
          # var above were ever dropped. Assert the count explicitly.
          grep -qE '^=+ 2 passed' /tmp/lifecycle.log || {
            echo "expected exactly 2 passed from test_stack_lifecycle.py" >&2
            exit 1
          }

      # Phase 1 Step 12 Phase A iteration (step12-phase-a-verify branch only):
      # continue-on-error deliberately dropped here so a genuine failure
      # shows up as an unambiguous job failure while this data plane is
      # being verified for the first time, rather than being masked. Not
      # yet proven green - do not read this branch's CI state as proof.
      - name: Run integration suite against a real stack (ATP_REQUIRE_INTEGRATION_STACK=1)
        env:
          ATP_REQUIRE_INTEGRATION_STACK: "1"
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee /tmp/integration.log

      # TEMPORARY (step12-phase-a-verify iteration only): raw job logs
      # require authenticated access even on a public repo, so this posts
      # the last part of the captured output as an issue (readable via the
      # unauthenticated public API) purely to unblock iteration. Remove
      # before merging to main.
      # `always()`, not `failure()`: a clean job exit is not evidence of a
      # clean *suite* - pytest reporting "78 skipped" exits 0 too. The
      # Phase A gate is the count line itself, so it has to be readable on
      # a successful run as well.
      - name: Post diagnostic log (temporary, iteration-only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pytest reports setup/teardown (fixture) failures in a separate
          # "ERRORS" section, distinct from "FAILURES" (assertion/body
          # failures) - both matter, but ERRORS is usually the smaller,
          # more load-bearing one when a connection gets poisoned mid-run
          # (the fixture error is the actual root cause; every FAILURES
          # entry after it is downstream noise). Capture ERRORS in full
          # (bounded to 30000 chars) plus the head of FAILURES (bounded to
          # 25000 chars, since it can otherwise exceed GitHub's 65536-char
          # issue body limit on its own) - together, comfortably under that
          # limit.
          if grep -q " ERRORS " /tmp/integration.log; then
            ERRORS_SECTION=$(awk '/ ERRORS /{f=1} f; /short test summary info/{exit}' /tmp/integration.log | head -c 30000)
          else
            ERRORS_SECTION="(none)"
          fi
          if grep -q "FAILURES" /tmp/integration.log; then
            FAILURES_SECTION=$(sed -n '/FAILURES/,$p' /tmp/integration.log | head -c 25000)
          else
            FAILURES_SECTION="(none)"
          fi
          SKIPPED=$(grep -E '^SKIPPED' /tmp/integration.log | head -c 4000)
          LIFECYCLE=$(grep -E '^=+ .*(passed|failed|error|skipped).* =+$' /tmp/lifecycle.log 2>/dev/null | tail -2)
          [ -n "$LIFECYCLE" ] || LIFECYCLE="(lifecycle step did not run)"
          [ -n "$SKIPPED" ] || SKIPPED="(none)"
          COUNTS=$(grep -E '^=+ .*(passed|failed|error|skipped).* =+$' /tmp/integration.log | tail -5)
          COLLECTED=$(grep -E '^collected [0-9]+ item' /tmp/integration.log | tail -2)
          TAIL=$(printf '=== COLLECTED ===\n%s\n\n=== COUNTS (in-container) ===\n%s\n\n=== COUNTS (host-side lifecycle) ===\n%s\n\n=== SKIPPED ===\n%s\n\n=== ERRORS (fixture/setup failures) ===\n%s\n\n=== FAILURES (head) ===\n%s' "$COLLECTED" "$COUNTS" "$LIFECYCLE" "$SKIPPED" "$ERRORS_SECTION" "$FAILURES_SECTION")
          jq -n \
            --arg title "CI integration ${{ job.status }}: run ${{ github.run_id }} (${{ github.sha }})" \
            --arg body "$(printf '```\n%s\n```\n' "$TAIL")" \
            '{title: $title, body: $body}' > /tmp/issue_body.json
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/issue_body.json

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
