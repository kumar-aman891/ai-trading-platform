[project]
name = "atp-api"
version = "0.1.0"
description = "FastAPI application — the only public-facing service. No live routes, no broker credentials (ADR-005, ADR-006)."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
    "atp-persistence",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    # Step 8 (authentication): Argon2id password hashing (docs/SECURITY.md,
    # docs/schemas/user.md). No other hashing library is used anywhere in
    # this codebase.
    "argon2-cffi>=23.1,<24",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }
atp-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_api"]
