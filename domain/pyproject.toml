[project]
name = "atp-domain"
version = "0.1.0"
description = "Pure domain kernel: types, money, ports, risk rules. No I/O, no framework dependencies (rules/01-architecture.md)."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_domain"]
