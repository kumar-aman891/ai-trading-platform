[project]
name = "atp-exec-paper"
version = "0.1.0"
description = "Paper execution gateway — the sole choke point through which a PAPER TradeProposal becomes state. Accepts {proposal_id} only. No broker credentials, no network egress."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
    "atp-persistence",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }
atp-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_exec_paper"]
