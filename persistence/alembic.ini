[alembic]
script_location = src/atp_persistence/migrations
version_path_separator = os
path_separator = os
prepend_sys_path = .

# No sqlalchemy.url here - security/SECRET_HANDLING.md rule 1 forbids a
# real DSN in a tracked file. env.py reads ATP_MIGRATION_DATABASE_URL (or
# DATABASE_URL as a fallback) from the process environment at runtime.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
