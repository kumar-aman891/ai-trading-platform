[project]
name = "atp-persistence"
version = "0.1.0"
description = "SQLAlchemy models, Alembic migrations, and repository implementations of domain.ports.storage."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_persistence"]
