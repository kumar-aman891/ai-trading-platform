[project]
name = "atp-persistence"
version = "0.1.0"
description = "SQLAlchemy models, Alembic migrations, and repository implementations of domain.ports.storage."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
    "sqlalchemy>=2.0.35,<3",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_persistence"]
