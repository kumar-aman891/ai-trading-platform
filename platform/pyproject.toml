[project]
name = "atp-platform"
version = "0.1.0"
description = "Cross-cutting platform concerns: config, secrets, logging, redaction, correlation, metrics, health."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
atp-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_platform"]
