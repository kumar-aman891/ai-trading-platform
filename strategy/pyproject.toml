[project]
name = "atp-strategy"
version = "0.1.0"
description = "Strategy execution boundary (ADR-014, ADR-015). Milestone 2B: service scaffolding and security boundary only - no strategy evaluation, scheduling, or proposal writing yet."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
    "atp-persistence",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }
atp-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_strategy"]
