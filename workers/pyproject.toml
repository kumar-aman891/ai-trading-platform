[project]
name = "atp-worker"
version = "0.1.0"
description = "Durable job-table worker: session reaping, audit-chain integrity checks, retention. Holds no order-path DB privileges."
requires-python = ">=3.12"
dependencies = [
    "atp-domain",
    "atp-platform",
    "atp-persistence",
]

[tool.uv.sources]
atp-domain = { workspace = true }
atp-platform = { workspace = true }
atp-persistence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp_worker"]
